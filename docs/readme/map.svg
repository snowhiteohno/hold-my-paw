<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="165" viewBox="0 0 1000 165" role="img" aria-labelledby="title"><title id="title">Three chapters: Clover shallows, Teacup town, The last rain.</title><style>.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.float{animation:none}}</style><rect width="1000" height="165" rx="24" fill="#f9f3e4"/><path d="M130 66 Q250 15 390 66 T680 66 T910 66" fill="none" stroke="#b4c3a0" stroke-width="3" stroke-dasharray="5 9"/><circle cx="165" cy="58" r="24" fill="#d5dfbe"/><g text-anchor="middle"><text x="165" y="64" fill="#59664e" font-size="18" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">01</text><text x="165" y="112" fill="#59664e" font-size="22" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">Clover shallows</text><text x="165" y="139" fill="#8b987b" font-size="13" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">Find your first little paws</text></g><circle cx="500" cy="58" r="24" fill="#d5dfbe"/><g text-anchor="middle"><text x="500" y="64" fill="#59664e" font-size="18" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">02</text><text x="500" y="112" fill="#59664e" font-size="22" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">Teacup town</text><text x="500" y="139" fill="#8b987b" font-size="13" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">Every friend has a purpose</text></g><circle cx="835" cy="58" r="24" fill="#d5dfbe"/><g text-anchor="middle"><text x="835" y="64" fill="#59664e" font-size="18" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">03</text><text x="835" y="112" fill="#59664e" font-size="22" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">The last rain</text><text x="835" y="139" fill="#8b987b" font-size="13" font-weight="600" font-family="