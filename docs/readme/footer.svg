<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-labelledby="title"><title id="title">You do not have to be brave all by yourself. Created by Mallika Suri.</title><style>.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.float{animation:none}}</style><rect width="1000" height="100" rx="20" fill="#edf0dc"/><g transform="translate(80 50) scale(0.65)"><path d="M0 -38 L12 -12 L40 -9 L19 10 L24 38 L0 24 L-24 38 L-19 10 L-40 -9 L-12 -12Z" fill="#ffe5a0" stroke="#c4aa6e" stroke-width="2"/><circle cx="-10" cy="4" r="3" fill="#59664e"/><circle cx="10" cy="4" r="3" fill="#59664e"/><path d="M-4 11 Q0 17 4 11" fill="none" stroke="#59664e" stroke-width="2"/><ellipse cx="-18" cy="11" rx="5" ry="3" fill="#e9b79d"/><ellipse cx="18" cy="11" rx="5" ry="3" fill="#e9b79d"/></g><text x="130" y="48" fill="#59664e" font-size="25" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">You do not have to be brave all by yourself.</text><text x="130" y="75" fill="#8e9b7d" font-size="11" font-weight="600" font-family="Trebuchet MS,Arial,sans-serif">HOLD MY PAW · CREATED BY MALLIKA SURI</text></svg>